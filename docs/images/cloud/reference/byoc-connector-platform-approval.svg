<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" viewBox="0 0 1320 800"><defs><marker id="ah-n" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#7d7d7d" d="M0 0 L10 5 L0 10 z"/></marker><marker id="ah-a" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#3b82f6" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect width="570" height="650" x="50" y="60" fill="#8a8a8a" fill-opacity=".06" stroke="#7d7d7d" stroke-dasharray="7 5" stroke-width="1.5" rx="14"/><text x="74" y="96" fill="#7d7d7d" font-size="16" font-weight="700">Your environment</text><rect width="370" height="650" x="900" y="60" fill="#8a8a8a" fill-opacity=".06" stroke="#7d7d7d" stroke-dasharray="7 5" stroke-width="1.5" rx="14"/><text x="924" y="96" fill="#7d7d7d" font-size="16" font-weight="700">ClickHouse Cloud</text><circle cx="940" cy="150" r="16" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-width="1.5"/><text x="940" y="155" fill="#7d7d7d" font-size="13" font-weight="700" text-anchor="middle">1</text><rect width="260" height="110" x="975" y="130" fill="#3b82f6" fill-opacity=".1" stroke="#3b82f6" stroke-width="1.5" rx="10"/><text x="1105" y="163" fill="#7d7d7d" font-size="14" font-weight="600" text-anchor="middle">ClickHouse proposes</text><text x="1105" y="181" fill="#7d7d7d" font-size="14" font-weight="600" text-anchor="middle">a platform update</text><text x="1105" y="203" fill="#7d7d7d" font-size="11" text-anchor="middle">snapshot controller, operator, monitoring</text><text x="1105" y="220" fill="#7d7d7d" font-size="11" text-anchor="middle">sent to the executor as a bundle</text><line x1="969" x2="591" y1="195" y2="195" stroke="#3b82f6" stroke-dasharray="5 4" stroke-width="1.5" marker-end="url(#ah-a)"/><text x="783" y="178" fill="#3b82f6" font-size="12" font-weight="600" text-anchor="middle">update proposed</text><text x="783" y="217" fill="#3b82f6" font-size="11" text-anchor="middle">over the WebSocket the executor opened</text><circle cx="90" cy="150" r="16" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-width="1.5"/><text x="90" y="155" fill="#7d7d7d" font-size="13" font-weight="700" text-anchor="middle">2</text><rect width="460" height="95" x="125" y="130" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-width="1.5" rx="10"/><text x="355" y="167" fill="#7d7d7d" font-size="14" font-weight="600" text-anchor="middle">Executor stages the bundle: approval needed</text><text x="355" y="191" fill="#7d7d7d" font-size="11" text-anchor="middle">nothing is applied until you approve the staged bundle</text><line x1="355" x2="355" y1="225" y2="270" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/><circle cx="90" cy="295" r="16" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-width="1.5"/><text x="90" y="300" fill="#7d7d7d" font-size="13" font-weight="700" text-anchor="middle">3</text><rect width="460" height="120" x="125" y="275" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-width="1.5" rx="10"/><text x="355" y="308" fill="#7d7d7d" font-size="11" text-anchor="middle">You inspect the staged bundle, then run</text><text x="355" y="333" fill="#7d7d7d" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="600" text-anchor="middle">clicklink clctl platform approve</text><text x="355" y="357" fill="#7d7d7d" font-size="11" text-anchor="middle">your credentials apply permissions, CRDs and roles</text><text x="355" y="375" fill="#7d7d7d" font-size="11" text-anchor="middle">a 2-hour token is minted</text><line x1="591" x2="690" y1="335" y2="335" stroke="#7d7d7d" stroke-dasharray="5 4" stroke-width="1.5"/><text x="785" y="331" fill="#7d7d7d" font-size="11.5" font-weight="600" text-anchor="middle">approval never leaves</text><text x="785" y="348" fill="#7d7d7d" font-size="11.5" font-weight="600" text-anchor="middle">your environment</text><line x1="355" x2="355" y1="395" y2="440" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/><circle cx="90" cy="465" r="16" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-width="1.5"/><text x="90" y="470" fill="#7d7d7d" font-size="13" font-weight="700" text-anchor="middle">4</text><rect width="460" height="90" x="125" y="445" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-width="1.5" rx="10"/><text x="355" y="481" fill="#7d7d7d" font-size="14" font-weight="600" text-anchor="middle">Executor applies the workloads</text><text x="355" y="501" fill="#7d7d7d" font-size="11" text-anchor="middle">Deployments, Services, ConfigMaps, Secrets, Jobs, PodDisruptionBudgets</text><text x="355" y="517" fill="#7d7d7d" font-size="11" text-anchor="middle">workload objects only, within the approval window</text><line x1="355" x2="355" y1="535" y2="580" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/><circle cx="90" cy="605" r="16" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-width="1.5"/><text x="90" y="610" fill="#7d7d7d" font-size="13" font-weight="700" text-anchor="middle">5</text><rect width="460" height="90" x="125" y="585" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-width="1.5" rx="10"/><text x="355" y="621" fill="#7d7d7d" font-size="14" font-weight="600" text-anchor="middle">Reported as synced</text><text x="355" y="645" fill="#7d7d7d" font-size="11" text-anchor="middle">the token expires; the next update needs a new approval</text><rect width="260" height="110" x="975" y="575" fill="#3b82f6" fill-opacity=".1" stroke="#3b82f6" stroke-width="1.5" rx="10"/><text x="1105" y="621" fill="#7d7d7d" font-size="14" font-weight="600" text-anchor="middle">Connector API endpoint</text><text x="1105" y="645" fill="#7d7d7d" font-size="11" text-anchor="middle">receives status only</text><line x1="591" x2="969" y1="630" y2="630" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/><text x="783" y="613" fill="#3b82f6" font-size="12" font-weight="600" text-anchor="middle">status: synced</text><text x="783" y="652" fill="#3b82f6" font-size="11" text-anchor="middle">over your outbound channel</text><g><line x1="64" x2="112" y1="755" y2="755" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/><text x="124" y="759" fill="#7d7d7d" font-size="12">outbound, authenticated (mTLS + request signing)</text><line x1="490" x2="538" y1="755" y2="755" stroke="#3b82f6" stroke-dasharray="5 4" stroke-width="1.5" marker-end="url(#ah-a)"/><text x="550" y="759" fill="#7d7d7d" font-size="12">delivered over the connection you opened</text><line x1="860" x2="908" y1="755" y2="755" stroke="#7d7d7d" stroke-dasharray="5 4" stroke-width="1.5"/><text x="920" y="759" fill="#7d7d7d" font-size="12">not a network connection</text></g></svg>