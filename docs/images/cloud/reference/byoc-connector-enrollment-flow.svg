<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" viewBox="0 0 1320 800"><defs><marker id="ah-n" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#7d7d7d" d="M0 0 L10 5 L0 10 z"/></marker><marker id="ah-a" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#3b82f6" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect width="570" height="650" x="50" y="60" fill="#8a8a8a" fill-opacity=".06" stroke="#7d7d7d" stroke-dasharray="7 5" stroke-width="1.5" rx="14"/><text x="74" y="96" fill="#7d7d7d" font-size="16" font-weight="700">Your environment</text><rect width="370" height="650" x="900" y="60" fill="#8a8a8a" fill-opacity=".06" stroke="#7d7d7d" stroke-dasharray="7 5" stroke-width="1.5" rx="14"/><text x="924" y="96" fill="#7d7d7d" font-size="16" font-weight="700">ClickHouse Cloud</text><circle cx="940" cy="150" r="16" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-width="1.5"/><text x="940" y="155" fill="#7d7d7d" font-size="13" font-weight="700" text-anchor="middle">1</text><rect width="260" height="110" x="975" y="130" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-width="1.5" rx="10"/><text x="1105" y="168" fill="#7d7d7d" font-size="14" font-weight="600" text-anchor="middle">Onboarding</text><text x="1105" y="192" fill="#7d7d7d" font-size="11" text-anchor="middle">ClickHouse issues your connector endpoint</text><text x="1105" y="210" fill="#7d7d7d" font-size="11" text-anchor="middle">and a single-use enrollment token</text><line x1="975" x2="591" y1="185" y2="185" stroke="#7d7d7d" stroke-dasharray="5 4" stroke-width="1.5" marker-end="url(#ah-n)"/><text x="783" y="168" fill="#7d7d7d" font-size="12" font-weight="500" text-anchor="middle">endpoint + single-use token</text><text x="783" y="207" fill="#7d7d7d" font-size="11" text-anchor="middle">shared during onboarding</text><circle cx="90" cy="150" r="16" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-width="1.5"/><text x="90" y="155" fill="#7d7d7d" font-size="13" font-weight="700" text-anchor="middle">2</text><rect width="460" height="110" x="125" y="130" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-width="1.5" rx="10"/><text x="355" y="167" fill="#7d7d7d" font-size="11" text-anchor="middle">You run</text><text x="355" y="193" fill="#7d7d7d" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="600" text-anchor="middle">clicklink clctl init --enroll</text><text x="355" y="218" fill="#7d7d7d" font-size="11" text-anchor="middle">paste the token at the hidden prompt</text><line x1="355" x2="355" y1="240" y2="279" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/><circle cx="90" cy="305" r="16" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-width="1.5"/><text x="90" y="310" fill="#7d7d7d" font-size="13" font-weight="700" text-anchor="middle">3</text><rect width="460" height="100" x="125" y="285" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-width="1.5" rx="10"/><text x="355" y="322" fill="#7d7d7d" font-size="14" font-weight="600" text-anchor="middle">Enrollment token redeemed</text><text x="355" y="346" fill="#7d7d7d" font-size="11" font-weight="600" text-anchor="middle">single use: the token cannot be redeemed twice</text><text x="355" y="364" fill="#7d7d7d" font-size="11" text-anchor="middle">identity material saved as handoff.yaml</text><line x1="355" x2="355" y1="385" y2="424" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/><circle cx="90" cy="450" r="16" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-width="1.5"/><text x="90" y="455" fill="#7d7d7d" font-size="13" font-weight="700" text-anchor="middle">4</text><rect width="460" height="110" x="125" y="430" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-width="1.5" rx="10"/><text x="355" y="472" fill="#7d7d7d" font-size="14" font-weight="600" text-anchor="middle">Key pair generated locally</text><text x="355" y="500" fill="#e05252" font-size="11.5" font-weight="600" text-anchor="middle">the private key never leaves your environment</text><line x1="355" x2="355" y1="540" y2="579" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/><circle cx="90" cy="605" r="16" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-width="1.5"/><text x="90" y="610" fill="#7d7d7d" font-size="13" font-weight="700" text-anchor="middle">5</text><rect width="460" height="95" x="125" y="585" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-width="1.5" rx="10"/><text x="355" y="625" fill="#7d7d7d" font-size="14" font-weight="600" text-anchor="middle">Connector deployed and verified</text><text x="355" y="649" fill="#7d7d7d" font-size="11" text-anchor="middle">scraper and troubleshooter running, health checks pass</text><rect width="260" height="255" x="975" y="285" fill="#3b82f6" fill-opacity=".1" stroke="#3b82f6" stroke-width="1.5" rx="10"/><text x="1105" y="398" fill="#7d7d7d" font-size="14" font-weight="600" text-anchor="middle">Enrollment endpoint</text><text x="1105" y="422" fill="#7d7d7d" font-size="11" text-anchor="middle">redeems your token, signs your CSR</text><line x1="591" x2="969" y1="320" y2="320" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/><text x="783" y="303" fill="#3b82f6" font-size="12" font-weight="600" text-anchor="middle">token redeemed once (HTTPS)</text><line x1="969" x2="591" y1="360" y2="360" stroke="#3b82f6" stroke-dasharray="5 4" stroke-width="1.5" marker-end="url(#ah-a)"/><text x="783" y="382" fill="#3b82f6" font-size="11" text-anchor="middle">identity material (handoff.yaml)</text><line x1="591" x2="969" y1="465" y2="465" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/><text x="783" y="448" fill="#3b82f6" font-size="12" font-weight="600" text-anchor="middle">CSR only (HTTPS)</text><line x1="969" x2="591" y1="505" y2="505" stroke="#3b82f6" stroke-dasharray="5 4" stroke-width="1.5" marker-end="url(#ah-a)"/><text x="783" y="527" fill="#3b82f6" font-size="11" text-anchor="middle">signed certificate</text><g><line x1="64" x2="112" y1="755" y2="755" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/><text x="124" y="759" fill="#7d7d7d" font-size="12">outbound HTTPS from your environment</text><line x1="440" x2="488" y1="755" y2="755" stroke="#3b82f6" stroke-dasharray="5 4" stroke-width="1.5" marker-end="url(#ah-a)"/><text x="500" y="759" fill="#7d7d7d" font-size="12">response on the same connection</text><line x1="770" x2="818" y1="755" y2="755" stroke="#7d7d7d" stroke-dasharray="5 4" stroke-width="1.5" marker-end="url(#ah-n)"/><text x="830" y="759" fill="#7d7d7d" font-size="12">shared out of band, not a network connection</text></g></svg>