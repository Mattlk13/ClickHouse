<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" viewBox="0 0 1320 700"><defs><marker id="ah-n" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#7d7d7d" d="M0 0 L10 5 L0 10 z"/></marker><marker id="ah-a" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#3b82f6" d="M0 0 L10 5 L0 10 z"/></marker><marker id="ah-r" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#e05252" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect width="750" height="560" x="40" y="50" fill="#8a8a8a" fill-opacity=".06" stroke="#7d7d7d" stroke-dasharray="7 5" stroke-width="1.5" rx="14"/><text x="64" y="86" fill="#7d7d7d" font-size="16" font-weight="700">Your environment</text><rect width="280" height="560" x="1000" y="50" fill="#8a8a8a" fill-opacity=".06" stroke="#7d7d7d" stroke-dasharray="7 5" stroke-width="1.5" rx="14"/><text x="1024" y="86" fill="#7d7d7d" font-size="16" font-weight="700">ClickHouse Cloud</text><rect width="200" height="220" x="60" y="175" fill="#8a8a8a" fill-opacity=".1" stroke="#7d7d7d" stroke-width="1.5" rx="10"/><text x="160" y="205" fill="#7d7d7d" font-size="14" font-weight="600" text-anchor="middle">Per-service cloud role</text><text x="160" y="227" fill="#7d7d7d" font-size="11" text-anchor="middle">one IAM role per service</text><text x="160" y="257" fill="#7d7d7d" font-size="11" text-anchor="middle">created by prepare</text><text x="160" y="273" fill="#7d7d7d" font-size="11" text-anchor="middle">with your credentials</text><text x="160" y="299" fill="#7d7d7d" font-size="11" text-anchor="middle">read/write to that</text><text x="160" y="315" fill="#7d7d7d" font-size="11" text-anchor="middle">service&apos;s buckets only</text><text x="160" y="341" fill="#7d7d7d" font-size="11" text-anchor="middle">assumed only by</text><text x="160" y="357" fill="#7d7d7d" font-size="11" text-anchor="middle">the service&apos;s pods</text><rect width="490" height="450" x="280" y="100" fill="#8a8a8a" fill-opacity=".05" stroke="#7d7d7d" stroke-dasharray="4 4" stroke-width="1.5" rx="12"/><text x="525" y="130" fill="#7d7d7d" font-size="14" font-weight="600" text-anchor="middle">Connector</text><text x="525" y="149" fill="#7d7d7d" font-size="11" text-anchor="middle">runs inside your environment</text><rect width="220" height="220" x="300" y="175" fill="#8a8a8a" fill-opacity=".1" stroke="#7d7d7d" stroke-width="1.5" rx="10"/><text x="410" y="205" fill="#7d7d7d" font-size="14" font-weight="600" text-anchor="middle">Executor identity</text><text x="410" y="228" fill="#7d7d7d" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="600" text-anchor="middle">pcm-executor</text><text x="410" y="257" fill="#7d7d7d" font-size="11" text-anchor="middle">Kubernetes ServiceAccount</text><text x="410" y="283" fill="#7d7d7d" font-size="11" text-anchor="middle">writes confined to service</text><text x="410" y="299" fill="#7d7d7d" font-size="11" text-anchor="middle">namespaces by an admission policy</text><text x="410" y="325" fill="#7d7d7d" font-size="11" text-anchor="middle">read access to workload state</text><rect width="220" height="220" x="540" y="175" fill="#8a8a8a" fill-opacity=".1" stroke="#7d7d7d" stroke-width="1.5" rx="10"/><text x="650" y="205" fill="#7d7d7d" font-size="14" font-weight="600" text-anchor="middle">Platform identity</text><text x="650" y="228" fill="#7d7d7d" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="600" text-anchor="middle">pcm-platform</text><text x="650" y="257" fill="#7d7d7d" font-size="11" text-anchor="middle">created by your approval</text><text x="650" y="283" fill="#7d7d7d" font-size="11" text-anchor="middle">2-hour token</text><text x="650" y="309" fill="#7d7d7d" font-size="11" text-anchor="middle">writes confined to</text><text x="650" y="325" fill="#7d7d7d" font-size="11" text-anchor="middle">platform namespaces</text><text x="650" y="351" fill="#7d7d7d" font-size="11" text-anchor="middle">never renewed</text><rect width="460" height="95" x="300" y="425" fill="#8a8a8a" fill-opacity=".1" stroke="#7d7d7d" stroke-width="1.5" rx="10"/><text x="530" y="460" fill="#7d7d7d" font-size="14" font-weight="600" text-anchor="middle">Read-only components</text><text x="530" y="482" fill="#7d7d7d" font-size="11" text-anchor="middle">Scraper and troubleshooter: read-only ClickHouse users,</text><text x="530" y="498" fill="#7d7d7d" font-size="11" text-anchor="middle">namespace-scoped read RBAC</text><rect width="220" height="140" x="1030" y="220" fill="#3b82f6" fill-opacity=".1" stroke="#3b82f6" stroke-width="1.5" rx="10"/><text x="1140" y="285" fill="#7d7d7d" font-size="14" font-weight="600" text-anchor="middle">Connector API endpoint</text><text x="1140" y="308" fill="#7d7d7d" font-size="11" text-anchor="middle">receives outbound connections only</text><line x1="770" x2="1024" y1="290" y2="290" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/><text x="897" y="273" fill="#3b82f6" font-size="12" font-weight="600" text-anchor="middle">commands and status</text><text x="897" y="310" fill="#3b82f6" font-size="11" text-anchor="middle">mTLS + request signing</text><line x1="1000" x2="796" y1="460" y2="460" stroke="#e05252" stroke-dasharray="6 5" stroke-width="1.75" marker-end="url(#ah-r)"/><circle cx="898" cy="460" r="12" fill="none" stroke="#e05252" stroke-width="2"/><line x1="889.5" x2="906.5" y1="451.5" y2="468.5" stroke="#e05252" stroke-width="2"/><text x="898" y="495" fill="#e05252" font-size="11.5" font-weight="600" text-anchor="middle">ClickHouse holds</text><text x="898" y="512" fill="#e05252" font-size="11.5" font-weight="600" text-anchor="middle">no cloud credentials</text><text x="898" y="529" fill="#e05252" font-size="11.5" font-weight="600" text-anchor="middle">and never connects inward</text><g><line x1="64" x2="112" y1="655" y2="655" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/><text x="124" y="659" fill="#7d7d7d" font-size="12">outbound, authenticated (mTLS + request signing)</text><line x1="480" x2="528" y1="655" y2="655" stroke="#e05252" stroke-dasharray="6 5" stroke-width="1.75" marker-end="url(#ah-r)"/><text x="540" y="659" fill="#7d7d7d" font-size="12">never happens</text><text x="700" y="659" fill="#7d7d7d" font-size="12" font-weight="600">All connections are initiated from your environment.</text></g></svg>