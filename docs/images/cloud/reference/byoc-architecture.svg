<svg xmlns="http://www.w3.org/2000/svg" aria-label="BYOC architecture: the ClickHouse control plane in the ClickHouse VPC manages a Kubernetes data plane inside the customer cloud account; ClickHouse data, backups, logs and monitoring data stay in the customer account and only bounded operational telemetry is exported." font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" role="img" viewBox="0 0 1280 762"><title>ClickHouse BYOC architecture</title><desc>Three zones. Left: the ClickHouse VPC control plane (Cloud console and infrastructure management). Centre: the customer cloud account, containing the Customer BYOC VPC with a Kubernetes cluster (ClickHouse services, Kubernetes API server, node pools across three availability zones, monitoring stack) and, outside the VPC, object storage for data parts, backups and archives. Right: users reaching the service over a public endpoint and customer applications reaching it over a private endpoint. ClickHouse management services reach the Kubernetes API over its public endpoint by default, or over an optional private connection that differs per cloud; a separate Tailscale zero-trust tunnel, initiated outbound from the customer cluster, carries approved ClickHouse engineer access along with metrics and dashboards. Three outbound telemetry flows leave the customer account: service and backup state, usage metrics and health alerts.</desc><defs><filter id="sh" width="112%" height="124%" x="-6%" y="-10%"><feDropShadow dx="0" dy="1" flood-opacity=".1" stdDeviation="1.4"/></filter><linearGradient id="svcGrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#fbfbfc"/></linearGradient><linearGradient id="chGrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fffdf4"/><stop offset="100%" stop-color="#fff3d1"/></linearGradient><marker id="aD" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1e88e5" d="M0,0 L10,5 L0,10 z"/></marker><marker id="aC" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#43a047" d="M0,0 L10,5 L0,10 z"/></marker><marker id="aH" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#8e24aa" d="M0,0 L10,5 L0,10 z"/></marker><marker id="aN" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#78909c" d="M0,0 L10,5 L0,10 z"/></marker><marker id="aNs" markerHeight="7" markerWidth="7" orient="auto" refX="1" refY="5" viewBox="0 0 10 10"><path fill="#78909c" d="M10,0 L0,5 L10,10 z"/></marker></defs><rect width="1280" height="762" fill="#fff"/><text x="24" y="44" fill="#212121" font-size="16" font-weight="700">ClickHouse BYOC — control plane and data plane</text><text x="24" y="66" fill="#616161" font-size="10.5">Your ClickHouse data, backups, logs and monitoring data stay in your cloud account. Only bounded operational telemetry is exported.</text><g fill="#455a64" font-size="11"><line x1="1064" x2="1098" y1="40" y2="40" stroke="#1e88e5" stroke-width="1.8" marker-end="url(#aD)"/><text x="1106" y="44">Data &amp; telemetry</text><line x1="1064" x2="1098" y1="64" y2="64" stroke="#43a047" stroke-width="1.8" marker-end="url(#aC)"/><text x="1106" y="68">Control &amp; management</text><line x1="1064" x2="1098" y1="88" y2="88" stroke="#8e24aa" stroke-width="1.8" marker-end="url(#aH)"/><text x="1106" y="92">Engineer &amp; dashboard access</text></g><rect width="270" height="458" x="24" y="106" fill="#f8f6fd" stroke="#7e57c2" stroke-width="1.6" rx="10"/><text x="40" y="128" fill="#5e35b1" font-size="13" font-weight="600">ClickHouse VPC — control plane</text><rect width="240" height="114" x="38" y="136" fill="#fff" stroke="#d1c4e9" stroke-width="1.2" rx="7"/><text x="58" y="156" fill="#546e7a" font-size="11.5" font-weight="600">ClickHouse Cloud console</text><g fill="url(#svcGrad)" stroke="#bdbdbd" stroke-width="1" filter="url(#sh)"><rect width="99" height="36" x="58" y="164" rx="5"/><rect width="99" height="36" x="161" y="164" rx="5"/><rect width="99" height="36" x="58" y="206" rx="5"/><rect width="99" height="36" x="161" y="206" rx="5"/></g><g fill="#424242" font-size="11" text-anchor="middle"><text x="108" y="186">Sign-on &amp; users</text><text x="211" y="186">APIs</text><text x="108" y="228">Monitoring</text><text x="211" y="228">Billing</text></g><rect width="240" height="286" x="38" y="258" fill="#fff" stroke="#d1c4e9" stroke-width="1.2" rx="7"/><text x="58" y="278" fill="#546e7a" font-size="11.5" font-weight="600">Infrastructure management</text><g fill="url(#svcGrad)" stroke="#bdbdbd" stroke-width="1" filter="url(#sh)"><rect width="202" height="38" x="58" y="285" rx="5"/><rect width="202" height="38" x="58" y="339" rx="5"/><rect width="202" height="38" x="58" y="488" rx="5"/></g><rect width="202" height="42" x="58" y="405" fill="#f4fbf4" stroke="#81c784" stroke-width="1.3" filter="url(#sh)" rx="5"/><g fill="#424242" font-size="11" text-anchor="middle"><text x="159" y="309">Event queue (SQS / Pub-Sub)</text><text x="159" y="363">Usage metering &amp; billing</text><text x="159" y="512">Alerting &amp; on-call</text><text x="159" y="424" fill="#2e7d32" font-size="11.5" font-weight="600">BYOC controller</text><text x="159" y="438" fill="#558b2f" font-size="9">provisions infra · applies service state</text></g><rect width="172" height="100" x="296" y="372" fill="#eceff1" stroke="#43a047" stroke-width="1.6" rx="12"/><g><text x="306" y="392" fill="#37474f" font-size="10.5" font-weight="600">Kubernetes API</text><text x="306" y="406" fill="#37474f" font-size="10.5" font-weight="600">private connection</text><text x="306" y="426" fill="#546e7a" font-size="10">AWS · VPC Lattice (optional)</text><text x="306" y="442" fill="#546e7a" font-size="10">GCP · GKE DNS endpoint</text><text x="306" y="458" fill="#546e7a" font-size="10">Azure · Private Link</text></g><rect width="156" height="64" x="292" y="576" fill="#eceff1" stroke="#8e24aa" stroke-width="1.6" rx="12"/><g text-anchor="middle"><text x="370" y="598" fill="#37474f" font-size="10.5" font-weight="600">Tailscale</text><text x="370" y="613" fill="#546e7a" font-size="9">zero-trust tunnel</text><text x="370" y="628" fill="#546e7a" font-size="9">metrics · dashboards</text></g><rect width="540" height="636" x="470" y="106" fill="#f3fbfa" stroke="#26a69a" stroke-width="1.8" rx="10"/><text x="486" y="130" fill="#00695c" font-size="13" font-weight="600">Your cloud account — AWS account / GCP project / Azure subscription</text><rect width="512" height="438" x="484" y="144" fill="#f6faff" stroke="#42a5f5" stroke-width="1.5" rx="8"/><text x="498" y="168" fill="#1565c0" font-size="12" font-weight="600">Customer BYOC VPC</text><rect width="488" height="386" x="496" y="180" fill="#f9f9fe" stroke="#5c6bc0" stroke-width="1.4" rx="8"/><text x="510" y="200" fill="#3949ab" font-size="12" font-weight="600">Kubernetes cluster — EKS / GKE / AKS</text><rect width="464" height="188" x="508" y="206" fill="#fff" stroke="#cfd8dc" stroke-width="1.2" rx="6"/><text x="520" y="224" fill="#546e7a" font-size="11.5" font-weight="600">ClickHouse services</text><g fill="url(#svcGrad)" stroke="#bdbdbd" stroke-width="1" filter="url(#sh)"><rect width="126" height="36" x="520" y="232" rx="5"/><rect width="126" height="36" x="520" y="286" rx="5"/><rect width="126" height="36" x="520" y="340" rx="5"/><rect width="134" height="36" x="826" y="232" rx="5"/><rect width="134" height="36" x="826" y="286" rx="5"/><rect width="134" height="36" x="826" y="340" rx="5"/></g><g fill="#424242" font-size="11" text-anchor="middle"><text x="583" y="254">ClickHouse operator</text><text x="583" y="308">State exporter</text><text x="583" y="362">Scraper</text><text x="893" y="254">Istio ingress</text><text x="893" y="308">External DNS</text><text x="893" y="362">Cert manager</text></g><rect width="156" height="144" x="658" y="232" fill="url(#chGrad)" stroke="#ffb300" stroke-width="1.6" filter="url(#sh)" rx="7"/><g text-anchor="middle"><text x="736" y="288" fill="#6d4c00" font-size="12.5" font-weight="600">ClickHouse cluster</text><text x="736" y="306" fill="#8d6e00" font-size="9.5">servers + Keeper</text><text x="736" y="322" fill="#8d6e00" font-size="9.5">your data stays here</text></g><g fill="url(#svcGrad)" stroke="#bdbdbd" stroke-width="1" filter="url(#sh)"><rect width="200" height="40" x="508" y="406" rx="5"/><rect width="252" height="40" x="720" y="406" rx="5"/></g><g fill="#424242" text-anchor="middle"><text x="608" y="431" font-size="11">Kubernetes API server</text><text x="846" y="431" font-size="10.5">Node pools across 3 availability zones</text></g><rect width="464" height="92" x="508" y="458" fill="#fff" stroke="#cfd8dc" stroke-width="1.2" rx="6"/><text x="520" y="476" fill="#546e7a" font-size="11.5" font-weight="600">Monitoring stack</text><g fill="url(#svcGrad)" stroke="#bdbdbd" stroke-width="1" filter="url(#sh)"><rect width="104" height="42" x="520" y="486" rx="5"/><rect width="104" height="42" x="636" y="486" rx="5"/><rect width="104" height="42" x="752" y="486" rx="5"/><rect width="104" height="42" x="868" y="486" rx="5"/></g><g fill="#424242" font-size="11" text-anchor="middle"><text x="572" y="512">Prometheus</text><text x="688" y="512">Grafana</text><text x="804" y="512">AlertManager</text><text x="920" y="512">Thanos</text></g><text x="520" y="544" fill="#78909c" font-size="9.5">Metrics, logs and alerts are produced and retained in your account</text><rect width="512" height="100" x="484" y="612" fill="#fff" stroke="#cfd8dc" stroke-width="1.2" rx="6"/><text x="498" y="634" fill="#546e7a" font-size="11.5" font-weight="600">Object storage (S3 / GCS / Azure Blob) — outside the VPC</text><g fill="url(#svcGrad)" stroke="#bdbdbd" stroke-width="1" filter="url(#sh)"><rect width="152" height="46" x="498" y="646" rx="5"/><rect width="152" height="46" x="664" y="646" rx="5"/><rect width="152" height="46" x="830" y="646" rx="5"/></g><g fill="#424242" font-size="11" text-anchor="middle"><text x="574" y="674">Data parts</text><text x="740" y="674">Backups</text><text x="906" y="674">Metrics &amp; log archive</text></g><text x="1160" y="126" fill="#455a64" font-size="11" text-anchor="middle">Users &amp; BI tools</text><g transform="translate(1140,136)"><circle cx="20" cy="12" r="9" fill="none" stroke="#546e7a" stroke-width="1.4"/><path fill="none" stroke="#546e7a" stroke-width="1.4" d="M6,44 Q20,28 34,44"/></g><rect width="190" height="180" x="1070" y="300" fill="#fafafa" stroke="#90a4ae" stroke-width="1.5" rx="8"/><text x="1082" y="322" fill="#455a64" font-size="12" font-weight="600">Customer VPC</text><g fill="url(#svcGrad)" stroke="#bdbdbd" stroke-width="1" filter="url(#sh)"><rect width="166" height="34" x="1082" y="332" rx="5"/><rect width="166" height="34" x="1082" y="374" rx="5"/><rect width="166" height="34" x="1082" y="416" rx="5"/></g><g fill="#424242" font-size="11" text-anchor="middle"><text x="1165" y="354">Applications</text><text x="1165" y="396">VMs / instances</text><text x="1165" y="438">Pods</text><text x="1165" y="466" fill="#9e9e9e" font-size="12">…</text></g><line x1="1014" x2="1066" y1="424" y2="424" stroke="#78909c" stroke-width="1.5" marker-end="url(#aN)" marker-start="url(#aNs)"/><text x="1040" y="414" fill="#546e7a" font-size="9" text-anchor="middle">VPC peering</text><g fill="none" stroke="#1e88e5" stroke-width="1.7"><line x1="520" x2="266" y1="304" y2="304" marker-end="url(#aD)"/><line x1="520" x2="266" y1="358" y2="358" marker-end="url(#aD)"/><line x1="508" x2="266" y1="507" y2="507" marker-end="url(#aD)"/><polyline marker-end="url(#aD)" points="100 526 100 610 128 610"/><polyline points="736 376 736 400 978 400 978 600 574 600"/><line x1="574" x2="574" y1="600" y2="608" marker-end="url(#aD)"/><polyline marker-end="url(#aD)" points="1160 186 1160 240 964 240"/><polyline marker-end="url(#aD)" points="1070 349 1042 349 1042 258 964 258"/></g><g fill="#1565c0" font-size="10.5" text-anchor="middle"><text x="382" y="296">service &amp; backup state</text><text x="382" y="350">usage metrics</text><text x="404" y="501" text-anchor="end">health alerts</text><text x="790" y="592" font-size="9.5">writes data parts &amp; backups</text><text x="114" y="560" font-size="9.5" text-anchor="start">page</text></g><g fill="#1565c0" font-size="10.5" text-anchor="end"><text x="1150" y="222">Public endpoint</text><text x="1150" y="234" font-size="9.5">HTTPS / native protocol</text><text x="1150" y="268">Private endpoint</text><text x="1150" y="280" font-size="8.5">AWS PrivateLink · GCP PSC</text><text x="1150" y="291" font-size="8.5">Azure Private Link</text></g><g fill="none" stroke="#43a047" stroke-width="1.7"><polyline marker-end="url(#aC)" points="47 250 47 426 54 426"/><line x1="260" x2="292" y1="426" y2="426" marker-end="url(#aC)"/><line x1="468" x2="504" y1="426" y2="426" marker-end="url(#aC)"/></g><line x1="448" x2="464" y1="507" y2="507" stroke="#fff" stroke-width="5"/><g fill="none" stroke="#8e24aa" stroke-width="1.7"><line x1="172" x2="288" y1="612" y2="612" marker-end="url(#aH)"/><polyline marker-end="url(#aH)" points="448 612 456 612 456 486 503 486"/></g><g fill="#6a1b9a" font-size="9.5" text-anchor="middle"><text x="370" y="658">read-only: monitoring &amp; system tables</text><text x="370" y="670">approved · time-bound · audited</text></g><g transform="translate(134,592)"><circle cx="20" cy="10" r="9" fill="none" stroke="#546e7a" stroke-width="1.4"/><path fill="none" stroke="#546e7a" stroke-width="1.4" d="M6,40 Q20,24 34,40"/></g><text x="154" y="650" fill="#455a64" font-size="11" text-anchor="middle">ClickHouse engineers</text></svg>