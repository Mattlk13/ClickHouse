<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" viewBox="0 0 1320 740"><defs><marker id="ah-a" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#3b82f6" d="M0 0 L10 5 L0 10 z"/></marker><marker id="ah-stop" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="5" refY="5" viewBox="0 0 10 10"><path fill="#e05252" d="M4 0 L6.5 0 L6.5 10 L4 10 z"/></marker></defs><rect width="460" height="600" x="40" y="50" fill="#8a8a8a" fill-opacity=".06" stroke="#7d7d7d" stroke-dasharray="7 5" stroke-width="1.5" rx="14"/><text x="64" y="86" fill="#7d7d7d" font-size="16" font-weight="700">Your service</text><rect width="580" height="600" x="700" y="50" fill="#8a8a8a" fill-opacity=".06" stroke="#7d7d7d" stroke-dasharray="7 5" stroke-width="1.5" rx="14"/><text x="724" y="86" fill="#7d7d7d" font-size="16" font-weight="700">ClickHouse Cloud</text><text x="724" y="106" fill="#7d7d7d" font-size="11">shared worker pool, your region</text><rect width="380" height="140" x="80" y="200" fill="#8a8a8a" fill-opacity=".1" stroke="#7d7d7d" stroke-width="1.5" rx="10"/><text x="270" y="238" fill="#7d7d7d" font-size="14" font-weight="600" text-anchor="middle">Your service compute</text><text x="270" y="262" fill="#7d7d7d" font-size="11" text-anchor="middle">your endpoint, authentication, and RBAC</text><text x="270" y="281" fill="#7d7d7d" font-size="11" text-anchor="middle">do not change</text><text x="270" y="309" fill="#7d7d7d" font-size="11" text-anchor="middle">requests workers per query</text><rect width="380" height="190" x="80" y="420" fill="#8a8a8a" fill-opacity=".05" stroke="#7d7d7d" stroke-dasharray="4 4" stroke-width="1.25" rx="10"/><text x="270" y="452" fill="#7d7d7d" font-size="13" font-weight="600" text-anchor="middle">What isolation means here</text><text x="270" y="478" fill="#7d7d7d" font-size="11" text-anchor="middle">A worker accepts traffic from exactly</text><text x="270" y="497" fill="#7d7d7d" font-size="11" text-anchor="middle">one service at a time.</text><text x="270" y="524" fill="#7d7d7d" font-size="11" text-anchor="middle">The restriction is applied by the platform</text><text x="270" y="543" fill="#7d7d7d" font-size="11" text-anchor="middle">at the network layer, not by the query engine,</text><text x="270" y="562" fill="#7d7d7d" font-size="11" text-anchor="middle">so a query cannot opt out of it.</text><text x="270" y="589" fill="#7d7d7d" font-size="11" text-anchor="middle">It is removed when the assignment ends.</text><rect width="500" height="76" x="740" y="140" fill="#8a8a8a" fill-opacity=".1" stroke="#7d7d7d" stroke-width="1.5" rx="10"/><text x="990" y="172" fill="#7d7d7d" font-size="14" font-weight="600" text-anchor="middle">Worker assignment service</text><text x="990" y="195" fill="#7d7d7d" font-size="11" text-anchor="middle">assigns workers to services and renews assignments</text><rect width="500" height="150" x="740" y="260" fill="#3b82f6" fill-opacity=".06" stroke="#3b82f6" stroke-dasharray="6 4" stroke-width="1.5" rx="10"/><text x="990" y="288" fill="#3b82f6" font-size="13" font-weight="600" text-anchor="middle">Assigned to your service</text><rect width="380" height="42" x="770" y="300" fill="#3b82f6" fill-opacity=".12" stroke="#3b82f6" stroke-width="1.25" rx="8"/><text x="960" y="326" fill="#7d7d7d" font-size="12" text-anchor="middle">Worker</text><rect width="380" height="42" x="770" y="352" fill="#3b82f6" fill-opacity=".12" stroke="#3b82f6" stroke-width="1.25" rx="8"/><text x="960" y="378" fill="#7d7d7d" font-size="12" text-anchor="middle">Worker</text><line x1="1180" x2="1180" y1="321" y2="373" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)" marker-start="url(#ah-a)"/><rect width="500" height="56" x="740" y="440" fill="#8a8a8a" fill-opacity=".1" stroke="#7d7d7d" stroke-width="1.25" rx="8"/><text x="990" y="465" fill="#7d7d7d" font-size="12" text-anchor="middle">Worker</text><text x="990" y="483" fill="#7d7d7d" font-size="11" text-anchor="middle">unassigned, waiting in the pool</text><rect width="500" height="56" x="740" y="520" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-dasharray="5 4" stroke-width="1.25" rx="8"/><text x="990" y="545" fill="#7d7d7d" font-size="12" text-anchor="middle">Worker</text><text x="990" y="563" fill="#7d7d7d" font-size="11" text-anchor="middle">assigned to another service</text><text x="740" y="620" fill="#7d7d7d" font-size="11">Workers hold no persistent data. When an assignment ends the worker is destroyed and replaced.</text><line x1="466" x2="734" y1="215" y2="178" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/><text x="600" y="215" fill="#3b82f6" font-size="12" font-weight="600" text-anchor="middle">request / renew assignment</text><path fill="none" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)" marker-start="url(#ah-a)" d="M466 255 L620 255 L620 335 L734 335"/><text x="543" y="245" fill="#3b82f6" font-size="12" font-weight="600" text-anchor="middle">query execution</text><text x="543" y="277" fill="#3b82f6" font-size="11" text-anchor="middle">private to your service</text><path fill="none" stroke="#e05252" stroke-dasharray="7 5" stroke-width="1.75" marker-end="url(#ah-stop)" d="M466 295 L600 295 L600 468 L734 468"/><text x="648" y="458" fill="#e05252" font-size="12" text-anchor="middle">no network path</text><path fill="none" stroke="#e05252" stroke-dasharray="7 5" stroke-width="1.75" marker-end="url(#ah-stop)" d="M466 325 L560 325 L560 548 L734 548"/><text x="647" y="538" fill="#e05252" font-size="12" text-anchor="middle">no network path</text><g><line x1="64" x2="112" y1="700" y2="700" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/><text x="124" y="704" fill="#7d7d7d" font-size="12">permitted while the worker is assigned to your service</text><line x1="470" x2="518" y1="700" y2="700" stroke="#e05252" stroke-dasharray="7 5" stroke-width="1.75" marker-end="url(#ah-stop)"/><text x="530" y="704" fill="#7d7d7d" font-size="12">blocked at the network layer</text><text x="820" y="704" fill="#7d7d7d" font-size="12" font-weight="600">A worker serves one service at a time.</text></g></svg>