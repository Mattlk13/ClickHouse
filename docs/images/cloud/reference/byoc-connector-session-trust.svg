<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" viewBox="0 0 1320 830"><defs><marker id="ah-n" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#7d7d7d" d="M0 0 L10 5 L0 10 z"/></marker><marker id="ah-a" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#3b82f6" d="M0 0 L10 5 L0 10 z"/></marker><marker id="ah-r" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#e05252" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect width="740" height="560" x="40" y="50" fill="#8a8a8a" fill-opacity=".06" stroke="#7d7d7d" stroke-dasharray="7 5" stroke-width="1.5" rx="14"/><text x="64" y="86" fill="#7d7d7d" font-size="16" font-weight="700">Your environment</text><rect width="280" height="560" x="1000" y="50" fill="#8a8a8a" fill-opacity=".06" stroke="#7d7d7d" stroke-dasharray="7 5" stroke-width="1.5" rx="14"/><text x="1024" y="86" fill="#7d7d7d" font-size="16" font-weight="700">ClickHouse Cloud</text><rect width="200" height="90" x="60" y="195" fill="#8a8a8a" fill-opacity=".1" stroke="#7d7d7d" stroke-width="1.5" rx="10"/><text x="160" y="233" fill="#7d7d7d" font-size="14" font-weight="600" text-anchor="middle">Your operator</text><text x="160" y="255" fill="#7d7d7d" font-size="11" text-anchor="middle">workstation</text><rect width="290" height="280" x="470" y="110" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-width="1.5" rx="10"/><text x="615" y="147" fill="#7d7d7d" font-size="14" font-weight="600" text-anchor="middle">Troubleshooter</text><text x="615" y="168" fill="#7d7d7d" font-size="11" text-anchor="middle">runs inside your environment</text><rect width="240" height="95" x="495" y="195" fill="#8a8a8a" fill-opacity=".16" stroke="#7d7d7d" stroke-width="1.25" rx="8"/><text x="615" y="228" fill="#7d7d7d" font-size="13" font-weight="600" text-anchor="middle">Session gateway</text><text x="615" y="250" fill="#7d7d7d" font-size="11" text-anchor="middle">enable / disable / status</text><text x="615" y="268" fill="#7d7d7d" font-size="11" text-anchor="middle">sessions expire automatically</text><line x1="260" x2="489" y1="240" y2="240" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/><text x="368" y="220" fill="#7d7d7d" font-size="12" font-weight="600" text-anchor="middle">enable / disable</text><text x="368" y="262" fill="#7d7d7d" font-size="11" text-anchor="middle">identity token + operator allowlist</text><text x="368" y="280" fill="#7d7d7d" font-size="11" text-anchor="middle">fingerprint-pinned TLS on VM</text><rect width="280" height="100" x="60" y="470" fill="#8a8a8a" fill-opacity=".1" stroke="#7d7d7d" stroke-width="1.5" rx="10"/><text x="200" y="505" fill="#7d7d7d" font-size="14" font-weight="600" text-anchor="middle">Audit log</text><text x="200" y="527" fill="#7d7d7d" font-size="11" text-anchor="middle">gateway calls and troubleshoot commands</text><text x="200" y="546" fill="#7d7d7d" font-size="11" font-weight="600" text-anchor="middle">stays in your environment</text><path fill="none" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)" d="M540 390 L540 520 L346 520"/><text x="448" y="507" fill="#7d7d7d" font-size="11" text-anchor="middle">every command recorded</text><rect width="220" height="130" x="1030" y="270" fill="#3b82f6" fill-opacity=".1" stroke="#3b82f6" stroke-width="1.5" rx="10"/><text x="1140" y="330" fill="#7d7d7d" font-size="14" font-weight="600" text-anchor="middle">Connector API endpoint</text><text x="1140" y="353" fill="#7d7d7d" font-size="11" text-anchor="middle">receives outbound connections only</text><line x1="760" x2="886" y1="340" y2="340" stroke="#3b82f6" stroke-width="1.75"/><circle cx="890" cy="340" r="3.5" fill="#3b82f6"/><line x1="890" x2="930" y1="340" y2="314" stroke="#3b82f6" stroke-width="2"/><circle cx="936" cy="340" r="3.5" fill="#3b82f6"/><line x1="940" x2="1024" y1="340" y2="340" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/><text x="858" y="280" fill="#3b82f6" font-size="12" font-weight="600" text-anchor="middle">outbound WebSocket</text><text x="858" y="298" fill="#3b82f6" font-size="11" text-anchor="middle">mTLS + request signing</text><text x="890" y="372" fill="#3b82f6" font-size="11.5" font-weight="600" text-anchor="middle">closed by default</text><text x="890" y="390" fill="#3b82f6" font-size="11" text-anchor="middle">opens only during an active session</text><path fill="none" stroke="#7d7d7d" stroke-dasharray="4 4" stroke-width="1.5" marker-end="url(#ah-n)" d="M735 240 L940 240 L940 306"/><text x="845" y="228" fill="#7d7d7d" font-size="11" text-anchor="middle">session state</text><line x1="1000" x2="786" y1="490" y2="490" stroke="#e05252" stroke-dasharray="6 5" stroke-width="1.75" marker-end="url(#ah-r)"/><circle cx="893" cy="490" r="12" fill="none" stroke="#e05252" stroke-width="2"/><line x1="884.5" x2="901.5" y1="481.5" y2="498.5" stroke="#e05252" stroke-width="2"/><text x="893" y="525" fill="#e05252" font-size="11.5" font-weight="600" text-anchor="middle">ClickHouse never connects</text><text x="893" y="542" fill="#e05252" font-size="11.5" font-weight="600" text-anchor="middle">into your environment</text><circle cx="1140" cy="680" r="11" fill="none" stroke="#7d7d7d" stroke-width="1.5"/><path fill="none" stroke="#7d7d7d" stroke-width="1.5" d="M1116 712 Q1140 696 1164 712"/><text x="1140" y="740" fill="#7d7d7d" font-size="13" font-weight="600" text-anchor="middle">ClickHouse support engineer</text><text x="1140" y="760" fill="#7d7d7d" font-size="11" text-anchor="middle">connects to ClickHouse Cloud only</text><line x1="1140" x2="1140" y1="662" y2="616" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/><g><line x1="64" x2="112" y1="795" y2="795" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/><text x="124" y="799" fill="#7d7d7d" font-size="12">outbound, authenticated (mTLS + request signing)</text><line x1="480" x2="528" y1="795" y2="795" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/><text x="540" y="799" fill="#7d7d7d" font-size="12">local, inside your environment</text><line x1="770" x2="818" y1="795" y2="795" stroke="#e05252" stroke-dasharray="6 5" stroke-width="1.75" marker-end="url(#ah-r)"/><text x="830" y="799" fill="#7d7d7d" font-size="12">never happens</text></g></svg>