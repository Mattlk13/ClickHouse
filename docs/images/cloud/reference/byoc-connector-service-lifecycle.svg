<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" viewBox="0 0 1320 870"><defs><marker id="ah-n" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#7d7d7d" d="M0 0 L10 5 L0 10 z"/></marker><marker id="ah-a" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#3b82f6" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect width="570" height="740" x="50" y="60" fill="#8a8a8a" fill-opacity=".06" stroke="#7d7d7d" stroke-dasharray="7 5" stroke-width="1.5" rx="14"/><text x="74" y="96" fill="#7d7d7d" font-size="16" font-weight="700">Your environment</text><rect width="370" height="740" x="900" y="60" fill="#8a8a8a" fill-opacity=".06" stroke="#7d7d7d" stroke-dasharray="7 5" stroke-width="1.5" rx="14"/><text x="924" y="96" fill="#7d7d7d" font-size="16" font-weight="700">ClickHouse Cloud</text><circle cx="90" cy="150" r="16" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-width="1.5"/><text x="90" y="155" fill="#7d7d7d" font-size="13" font-weight="700" text-anchor="middle">1</text><rect width="460" height="95" x="125" y="130" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-width="1.5" rx="10"/><text x="355" y="163" fill="#7d7d7d" font-size="11" text-anchor="middle">You run</text><text x="355" y="188" fill="#7d7d7d" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="600" text-anchor="middle">clicklink clctl executor prepare</text><text x="355" y="211" fill="#7d7d7d" font-size="11" text-anchor="middle">buckets, IAM role, password shown once</text><line x1="355" x2="355" y1="225" y2="265" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/><circle cx="90" cy="290" r="16" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-width="1.5"/><text x="90" y="295" fill="#7d7d7d" font-size="13" font-weight="700" text-anchor="middle">2</text><rect width="460" height="95" x="125" y="270" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-width="1.5" rx="10"/><text x="355" y="303" fill="#7d7d7d" font-size="11" text-anchor="middle">You run</text><text x="355" y="328" fill="#7d7d7d" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="600" text-anchor="middle">clicklink clctl instances create --from-prepare</text><text x="355" y="351" fill="#7d7d7d" font-size="11" text-anchor="middle">submitted through your connector endpoint</text><line x1="355" x2="355" y1="365" y2="405" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/><circle cx="90" cy="430" r="16" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-width="1.5"/><text x="90" y="435" fill="#7d7d7d" font-size="13" font-weight="700" text-anchor="middle">3</text><rect width="460" height="90" x="125" y="410" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-width="1.5" rx="10"/><text x="355" y="446" fill="#7d7d7d" font-size="14" font-weight="600" text-anchor="middle">Command delivered over the outbound channel</text><text x="355" y="470" fill="#7d7d7d" font-size="11" text-anchor="middle">WebSocket the executor opened; nothing connects inward</text><line x1="355" x2="355" y1="500" y2="540" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/><circle cx="90" cy="565" r="16" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-width="1.5"/><text x="90" y="570" fill="#7d7d7d" font-size="13" font-weight="700" text-anchor="middle">4</text><rect width="460" height="90" x="125" y="545" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-width="1.5" rx="10"/><text x="355" y="581" fill="#7d7d7d" font-size="14" font-weight="600" text-anchor="middle">Executor applies the service definition</text><text x="355" y="605" fill="#7d7d7d" font-size="11" text-anchor="middle">Kubernetes API, service namespace only</text><line x1="355" x2="355" y1="635" y2="675" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/><circle cx="90" cy="700" r="16" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-width="1.5"/><text x="90" y="705" fill="#7d7d7d" font-size="13" font-weight="700" text-anchor="middle">5</text><rect width="460" height="90" x="125" y="680" fill="#8a8a8a" fill-opacity=".14" stroke="#7d7d7d" stroke-width="1.5" rx="10"/><text x="355" y="716" fill="#7d7d7d" font-size="14" font-weight="600" text-anchor="middle">Status reported back</text><text x="355" y="740" fill="#7d7d7d" font-size="11" text-anchor="middle">running once replicas are ready; failures are reported too</text><rect width="260" height="500" x="975" y="270" fill="#3b82f6" fill-opacity=".1" stroke="#3b82f6" stroke-width="1.5" rx="10"/><text x="1105" y="504" fill="#7d7d7d" font-size="14" font-weight="600" text-anchor="middle">Connector API endpoint</text><text x="1105" y="528" fill="#7d7d7d" font-size="11" text-anchor="middle">forwards the create to ClickHouse Cloud,</text><text x="1105" y="545" fill="#7d7d7d" font-size="11" text-anchor="middle">which renders the service definition</text><line x1="591" x2="969" y1="300" y2="300" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/><text x="783" y="283" fill="#3b82f6" font-size="12" font-weight="600" text-anchor="middle">create request (HTTPS)</text><line x1="969" x2="591" y1="340" y2="340" stroke="#3b82f6" stroke-dasharray="5 4" stroke-width="1.5" marker-end="url(#ah-a)"/><text x="783" y="362" fill="#3b82f6" font-size="11" text-anchor="middle">accepted; service name</text><line x1="969" x2="591" y1="455" y2="455" stroke="#3b82f6" stroke-dasharray="5 4" stroke-width="1.5" marker-end="url(#ah-a)"/><text x="783" y="438" fill="#3b82f6" font-size="12" font-weight="600" text-anchor="middle">lifecycle command</text><text x="783" y="477" fill="#3b82f6" font-size="11" text-anchor="middle">over the WebSocket the executor opened</text><line x1="591" x2="969" y1="725" y2="725" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/><text x="783" y="708" fill="#3b82f6" font-size="12" font-weight="600" text-anchor="middle">status</text><text x="783" y="747" fill="#3b82f6" font-size="11" text-anchor="middle">running, or the failure reason</text><g><line x1="64" x2="112" y1="845" y2="845" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/><text x="124" y="849" fill="#7d7d7d" font-size="12">outbound from your environment (HTTPS or WebSocket)</text><line x1="480" x2="528" y1="845" y2="845" stroke="#3b82f6" stroke-dasharray="5 4" stroke-width="1.5" marker-end="url(#ah-a)"/><text x="540" y="849" fill="#7d7d7d" font-size="12">delivered back over the connection you opened</text></g></svg>